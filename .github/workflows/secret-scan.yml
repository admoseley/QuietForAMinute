name: Secret scan

# Runs the open-source gitleaks CLI directly rather than the gitleaks/gitleaks-action wrapper —
# that wrapper requires a paid GITLEAKS_LICENSE for private repositories. The underlying gitleaks
# binary itself is fully open source and free regardless of repo visibility.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history on a PR, not just the merge commit

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose
